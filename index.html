<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đăng nhập / Đăng ký</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="tabs">
    <div class="tab active" id="tab-login" onclick="switchTab('login')">Đăng nhập</div>
    <div class="tab" id="tab-register" onclick="switchTab('register')">Đăng ký</div>
  </div>

  <div class="form-box">
    <!-- Form đăng nhập -->
    <form class="form active" id="form-login">
      <input type="text" placeholder="Tên đăng nhập hoặc Email" required>
      <input type="password" placeholder="Mật khẩu" required>
      <button type="submit">Đăng nhập</button>
      <p>Chưa có tài khoản? <a href="#" onclick="switchTab('register')">Đăng ký ngay</a></p>
    </form>

    <!-- Form đăng ký -->
    <form class="form" id="form-register">
      <input type="text" placeholder="Họ và tên" required>
      <input type="email" placeholder="Email" required>
      <input type="password" placeholder="Mật khẩu" required>
      <input type="password" placeholder="Xác nhận mật khẩu" required>
      <button type="submit">Đăng ký</button>
      <p>Đã có tài khoản? <a href="#" onclick="switchTab('login')">Đăng nhập</a></p>
    </form>
  </div>
</div>

<script>
  function switchTab(tab) {
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    document.getElementById('form-login').classList.toggle('active', tab === 'login');
    document.getElementById('form-register').classList.toggle('active', tab === 'register');
  }
</script>

</body>
</html>
